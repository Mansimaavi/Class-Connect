# Full stack on your machine:  docker compose up --build   ->  http://localhost:8080
# (API docs at http://localhost:8080/api/docs)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./Backend
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/classconnect
      CLIENT_URL: http://localhost:8080
      # local HTTP only; production runs behind HTTPS with secure cookies
      COOKIE_SECURE: "false"
      TRUST_PROXY: "1"
      # prints sign-up codes to `docker compose logs api` instead of emailing them
      EMAIL_DELIVERY: ${EMAIL_DELIVERY:-log}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-local-dev-2fa-key-change-me}
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./Frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:5000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
